name: Statistiche download

# Ogni giorno registra download delle release e git clone, e aggiorna i grafici a barre.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Somma i download delle release
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '[.[].assets[].download_count] | add // 0' | awk '{s+=$1} END{print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Leggi i git clone (traffic API)
        env:
          # Serve un token con accesso al traffico: il token del workflow di solito non basta.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: |
          gh api "repos/${{ github.repository }}/traffic/clones" > clones.json \
            || { echo "::warning::Traffic API non accessibile: imposta il secret TRAFFIC_TOKEN"; echo '{"clones":[]}' > clones.json; }

      - name: Aggiorna CSV e grafici
        run: |
          python3 scripts/make_chart.py downloads "${{ steps.dl.outputs.total }}"
          python3 scripts/make_chart.py clones clones.json

      - name: Commit delle statistiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats docs/downloads.svg docs/clones.svg
          git diff --cached --quiet || { git commit -m "chore: aggiorna statistiche download"; git push; }
