name: Statistiche download

# Ogni giorno registra il totale dei download delle release e aggiorna il grafico a barre.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Somma i download delle release
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '[.[].assets[].download_count] | add // 0' | awk '{s+=$1} END{print s+0}')
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Aggiorna CSV e grafico
        run: python3 scripts/make_chart.py downloads "${{ steps.dl.outputs.total }}"

      - name: Commit delle statistiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats docs/downloads.svg
          git diff --cached --quiet || { git commit -m "chore: aggiorna statistiche download"; git push; }
