name: Release

# Crea una nuova release ogni volta che cambia lo script o l'elenco dei server.
on:
  push:
    branches: [main]
    paths:
      - purevpn-wg
      - locations.tsv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Controllo sintassi
        run: bash -n purevpn-wg

      - name: Checksum
        run: sha256sum purevpn-wg locations.tsv > SHA256SUMS

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" purevpn-wg locations.tsv SHA256SUMS LICENSE \
            --title "$TAG" --target "$GITHUB_SHA" --generate-notes \
            --notes "Installazione: scarica \`purevpn-wg\` e \`locations.tsv\` nella stessa cartella, \`chmod +x purevpn-wg\`, poi \`./purevpn-wg setup\`. Oppure usa \`git clone\` (vedi README). Verifica con \`sha256sum -c SHA256SUMS\`."
